name: Terraform plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the Terraform root config to plan
        type: string
        required: true
      terraform_version:
        description: Terraform CLI version to install
        type: string
        default: "latest"
      plan_artifact_name:
        description: Name to upload the plan file as, for a later terraform-apply.yml call to consume
        type: string
        default: "tfplan"
      tfvars_json:
        description: JSON object of ad-hoc Terraform variable overrides. Applied last, so it wins over the cascading var files below.
        type: string
        default: "{}"
      var_files_root:
        description: >
          Base directory for the cascading var-file convention. If set, applies (in ascending
          precedence, each only if the file exists): <root>/global.tfvars,
          <root>/<account>/account.tfvars, <root>/<account>/<region>/region.tfvars,
          <root>/<account>/<region>/<environment>/env.tfvars,
          <root>/<account>/<region>/<environment>/<service>.tfvars. Leave empty to skip.
        type: string
        default: ""
      account:
        description: Account-level scope (e.g. an Azure subscription alias). Also selects/creates a Terraform workspace of this name when set.
        type: string
        default: ""
      region:
        description: Region-level scope
        type: string
        default: ""
      environment:
        description: Environment-level scope (e.g. dev/staging/prod)
        type: string
        default: ""
      service:
        description: Finest-grained scope -- the specific root config/service being planned
        type: string
        default: ""
      backend_config:
        description: Newline-separated key=value pairs, each passed as a `terraform init -backend-config=`
        type: string
        default: ""
      azure_client_id:
        description: Client ID of the Azure AD app/identity to authenticate as (OIDC, no secret needed). Leave empty for root configs that don't use the azurerm provider.
        type: string
        default: ""
      azure_tenant_id:
        description: Azure AD tenant ID
        type: string
        default: ""
      azure_subscription_id:
        description: Azure subscription ID
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
  ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
  ARM_USE_OIDC: "true"
  VAR_FILES_ROOT: ${{ inputs.var_files_root }}
  ACCOUNT: ${{ inputs.account }}
  REGION: ${{ inputs.region }}
  ENVIRONMENT: ${{ inputs.environment }}
  SERVICE: ${{ inputs.service }}
  TFVARS_JSON: ${{ inputs.tfvars_json }}
  BACKEND_CONFIG: ${{ inputs.backend_config }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: "true"

      - name: terraform init
        working-directory: ${{ inputs.working_directory }}
        run: |
          init_args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            init_args+=("-backend-config=$line")
          done <<< "$BACKEND_CONFIG"
          terraform init "${init_args[@]}"

      - name: Select workspace
        if: inputs.account != ''
        working-directory: ${{ inputs.working_directory }}
        run: terraform workspace select -or-create "$ACCOUNT"

      - name: terraform plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          var_file_args=()

          if [ -n "$VAR_FILES_ROOT" ]; then
            candidates=("$VAR_FILES_ROOT/global.tfvars")
            [ -n "$ACCOUNT" ] && candidates+=("$VAR_FILES_ROOT/$ACCOUNT/account.tfvars")
            [ -n "$ACCOUNT" ] && [ -n "$REGION" ] && candidates+=("$VAR_FILES_ROOT/$ACCOUNT/$REGION/region.tfvars")
            [ -n "$ACCOUNT" ] && [ -n "$REGION" ] && [ -n "$ENVIRONMENT" ] && candidates+=("$VAR_FILES_ROOT/$ACCOUNT/$REGION/$ENVIRONMENT/env.tfvars")
            [ -n "$ACCOUNT" ] && [ -n "$REGION" ] && [ -n "$ENVIRONMENT" ] && [ -n "$SERVICE" ] && candidates+=("$VAR_FILES_ROOT/$ACCOUNT/$REGION/$ENVIRONMENT/$SERVICE.tfvars")

            for f in "${candidates[@]}"; do
              if [ -e "$f" ]; then
                echo "Using var file: $f"
                var_file_args+=("-var-file=$f")
              else
                echo "::warning::var file not found, skipping: $f"
              fi
            done
          fi

          # Ad-hoc overrides always win: applied last, so later -var-file wins per Terraform's own precedence rules.
          echo "$TFVARS_JSON" > ci-overrides.tfvars.json
          var_file_args+=("-var-file=ci-overrides.tfvars.json")

          terraform plan -out=tfplan -input=false "${var_file_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 5
