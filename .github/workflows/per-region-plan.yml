name: Per-region Terraform plan

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      terraform_version:
        type: string
        default: "latest"
      plan_artifact_name:
        type: string
        default: "tfplan"
      region:
        type: string
        required: true
      account:
        type: string
        default: ""
      environment:
        type: string
        default: ""
      service:
        type: string
        default: ""
      var_files_root:
        type: string
        default: ""
      tfvars_json:
        type: string
        default: "{}"
      backend_config:
        type: string
        default: ""
      azure_client_id:
        type: string
        default: ""
      azure_tenant_id:
        type: string
        default: ""
      azure_subscription_id:
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-region/jobs/terraform-plan@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}
          region: ${{ inputs.region }}
          account: ${{ inputs.account }}
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          var_files_root: ${{ inputs.var_files_root }}
          tfvars_json: ${{ inputs.tfvars_json }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
