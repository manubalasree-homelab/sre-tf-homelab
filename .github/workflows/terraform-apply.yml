name: Terraform apply

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the Terraform root config to apply
        type: string
        required: true
      terraform_version:
        description: Terraform CLI version to install
        type: string
        default: "latest"
      plan_artifact_name:
        description: Name the plan file was uploaded as by a prior terraform-plan.yml call
        type: string
        default: "tfplan"
      github_environment:
        description: >
          GitHub Environment to run this job under (for required-reviewer approval gates).
          Leave empty for no gate. This is how per-account/per-environment/per-region
          approval requirements are expressed, instead of separate apply workflows per scope.
        type: string
        default: ""
      account:
        description: Account-level scope this plan was created under. Must match the value passed to terraform-plan.yml, so the same Terraform workspace gets selected before applying.
        type: string
        default: ""
      backend_config:
        description: Newline-separated key=value pairs, each passed as a `terraform init -backend-config=`. Must match the value passed to terraform-plan.yml.
        type: string
        default: ""
      azure_client_id:
        description: Client ID of the Azure AD app/identity to authenticate as (OIDC, no secret needed). Leave empty for root configs that don't use the azurerm provider.
        type: string
        default: ""
      azure_tenant_id:
        description: Azure AD tenant ID
        type: string
        default: ""
      azure_subscription_id:
        description: Azure subscription ID
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
  ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
  ARM_USE_OIDC: "true"
  ACCOUNT: ${{ inputs.account }}
  BACKEND_CONFIG: ${{ inputs.backend_config }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: terraform init
        working-directory: ${{ inputs.working_directory }}
        run: |
          init_args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            init_args+=("-backend-config=$line")
          done <<< "$BACKEND_CONFIG"
          terraform init "${init_args[@]}"

      - name: Select workspace
        if: inputs.account != ''
        working-directory: ${{ inputs.working_directory }}
        run: terraform workspace select -or-create "$ACCOUNT"

      - name: terraform apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -input=false tfplan
