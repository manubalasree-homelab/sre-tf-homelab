name: Per-environment Terraform deploy

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      terraform_version:
        type: string
        default: "latest"
      environment:
        description: >
          The environment being deployed (e.g. dev/staging/prod). Also used directly as the
          GitHub Environment name for a required-reviewer approval gate on the apply job --
          unlike per-account/per-region, there's no separate github_environment input here,
          since for this scope the deployment environment and the approval gate are naturally
          the same thing. Create a GitHub Environment with this exact name (with reviewers
          configured) to gate it; otherwise it applies straight through.
        type: string
        required: true
      account:
        type: string
        default: ""
      region:
        type: string
        default: ""
      service:
        type: string
        default: ""
      var_files_root:
        description: Base directory for the cascading var-file convention, relative to working_directory.
        type: string
        default: ""
      tfvars_json:
        type: string
        default: "{}"
      backend_config:
        type: string
        default: ""
      azure_client_id:
        type: string
        default: ""
      azure_tenant_id:
        type: string
        default: ""
      azure_subscription_id:
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-environment/jobs/terraform-plan@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          environment: ${{ inputs.environment }}
          account: ${{ inputs.account }}
          region: ${{ inputs.region }}
          service: ${{ inputs.service }}
          var_files_root: ${{ inputs.var_files_root }}
          tfvars_json: ${{ inputs.tfvars_json }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-environment/jobs/terraform-apply@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
