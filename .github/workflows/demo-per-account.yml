name: "Demo: per-account deploy"

on:
  workflow_dispatch: {}

jobs:
  plan:
    strategy:
      matrix:
        account: [acct-a, acct-b]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/terraform-plan.yml@main
    with:
      working_directory: demos/scaling-demo
      plan_artifact_name: tfplan-account-${{ matrix.account }}
      tfvars_json: '{"account":"${{ matrix.account }}"}'

  apply:
    needs: plan
    strategy:
      matrix:
        account: [acct-a, acct-b]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/terraform-apply.yml@main
    with:
      working_directory: demos/scaling-demo
      plan_artifact_name: tfplan-account-${{ matrix.account }}
