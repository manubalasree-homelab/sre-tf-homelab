name: "Demo: per-account deploy"

on:
  workflow_dispatch: {}

jobs:
  plan:
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        account: [acct-a, acct-b]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/per-account-plan.yml@main
    with:
      working_directory: demos/scaling-demo
      plan_artifact_name: tfplan-account-${{ matrix.account }}
      # tfvars_json sets `account` (highest precedence, always wins); region/environment
      # come from the cascading var files below -- acct-a has an account.tfvars (sets
      # environment), acct-b doesn't, so acct-b's plan logs a "not found" warning and
      # falls back to global.tfvars's region only. Demonstrates both layers together.
      tfvars_json: '{"account":"${{ matrix.account }}"}'
      var_files_root: vars
      account: ${{ matrix.account }}

  apply:
    needs: plan
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        account: [acct-a, acct-b]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/per-account-apply.yml@main
    with:
      working_directory: demos/scaling-demo
      plan_artifact_name: tfplan-account-${{ matrix.account }}
      account: ${{ matrix.account }}
