name: Per-account Terraform apply

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      terraform_version:
        type: string
        default: "latest"
      plan_artifact_name:
        type: string
        default: "tfplan"
      account:
        type: string
        required: true
      backend_config:
        type: string
        default: ""
      github_environment:
        description: GitHub Environment for a required-reviewer approval gate. Leave empty for no gate.
        type: string
        default: ""
      azure_client_id:
        type: string
        default: ""
      azure_tenant_id:
        type: string
        default: ""
      azure_subscription_id:
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-account/jobs/terraform-apply@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}
          account: ${{ inputs.account }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
