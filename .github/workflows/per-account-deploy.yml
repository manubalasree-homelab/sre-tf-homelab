name: Per-account Terraform deploy

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true
      terraform_version:
        type: string
        default: "latest"
      account:
        description: Account (Azure subscription) scope. Selects/creates a matching Terraform workspace.
        type: string
        required: true
      region:
        type: string
        default: ""
      environment:
        type: string
        default: ""
      service:
        type: string
        default: ""
      var_files_root:
        description: Base directory for the cascading var-file convention, relative to working_directory.
        type: string
        default: ""
      tfvars_json:
        type: string
        default: "{}"
      backend_config:
        type: string
        default: ""
      github_environment:
        description: GitHub Environment for a required-reviewer approval gate on the apply job. Leave empty for no gate.
        type: string
        default: ""
      azure_client_id:
        type: string
        default: ""
      azure_tenant_id:
        type: string
        default: ""
      azure_subscription_id:
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-account/jobs/terraform-plan@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          account: ${{ inputs.account }}
          region: ${{ inputs.region }}
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          var_files_root: ${{ inputs.var_files_root }}
          tfvars_json: ${{ inputs.tfvars_json }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    steps:
      - uses: manubalasree-homelab/sre-tf-homelab/per-account/jobs/terraform-apply@main
        with:
          working_directory: ${{ inputs.working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          account: ${{ inputs.account }}
          backend_config: ${{ inputs.backend_config }}
          azure_client_id: ${{ inputs.azure_client_id }}
          azure_tenant_id: ${{ inputs.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
