name: "Demo: per-environment deploy"

on:
  workflow_dispatch: {}

jobs:
  plan:
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        environment: [dev, staging, prod]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/per-environment-plan.yml@main
    with:
      working_directory: demos/scaling-demo
      environment: ${{ matrix.environment }}
      plan_artifact_name: tfplan-environment-${{ matrix.environment }}
      tfvars_json: '{"environment":"${{ matrix.environment }}"}'

  apply:
    needs: plan
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        environment: [dev, staging, prod]
    uses: manubalasree-homelab/sre-tf-homelab/.github/workflows/per-environment-apply.yml@main
    with:
      working_directory: demos/scaling-demo
      plan_artifact_name: tfplan-environment-${{ matrix.environment }}
      # "prod" maps directly to a real GitHub Environment with a required
      # reviewer configured (see demos/README.md) -- dev/staging apply
      # straight through, prod pauses for approval.
      environment: ${{ matrix.environment }}
